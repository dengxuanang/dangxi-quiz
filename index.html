  document.getElementById('mTotal').textContent = list.length;
  document.getElementById('pbar').style.width = ((state.idx+1)/list.length*100) + '%';

  const rec = state.rec[key()] || {};
  const card = document.getElementById('qcard');

  let html = `<span class="qtype ${TYPE_CLS[state.type]}">${TYPE_LABEL[state.type]} ${state.idx+1}</span>`;
  html += `<div class="qstem">${escapeHtml(q.s)}</div>`;

  if (state.type === 'single' || state.type === 'multi') {
    const multi = state.type === 'multi';
    html += '<div class="opts">';
    q.o.forEach(opt => {
      let cls = 'opt';
      if (rec.ans) {
        cls += ' disabled';
        const chosen = rec.ans.includes(opt.key);
        const isAns = q.a.includes(opt.key);
        if (isAns) cls += ' correct';
        else if (chosen) cls += ' wrong';
      } else if (rec.tmp && rec.tmp.includes(opt.key)) {
        cls += ' selected';
      }
      html += `<div class="${cls}" data-k="${opt.key}">
                 <div class="key">${opt.key}</div>
                 <div>${escapeHtml(opt.text)}</div>
               </div>`;
    });
    html += '</div>';
    if (multi && !rec.ans) {
      html += `<div class="explain show" style="margin-top:12px;color:#fa8c16">多选题：先勾选选项，再点下方"提交答案"</div>`;
    }
  } else if (state.type === 'judge') {
    html += '<div class="judge-btns">';
    [['T','✓ 正确'],['F','✕ 错误']].forEach(([v,txt]) => {
      let cls = 'jbtn';
      if (rec.ans) {
        const isAns = (q.a ? 'T':'F') === v;
        const chosen = rec.ans === v;
        if (isAns) cls += ' correct';
        else if (chosen) cls += ' wrong';
      }
      html += `<button class="${cls}" data-v="${v}">${txt}</button>`;
    });
    html += '</div>';
  } else {
    // 填空背诵
    if (q.a) {
      html += `<div class="fill-answer ${rec.ans?'show':''}">参考答案：${escapeHtml(q.a)}</div>`;
    } else {
      html += `<div class="explain show" style="color:#999">本题为完整知识点，建议阅读记忆</div>`;
    }
  }

  // 解析说明
  if (rec.ans && state.type !== 'fill') {
    const right = state.type === 'judge' ? (rec.ans === (q.a?'T':'F')) : (rec.ans === q.a);
    let answerTxt = state.type === 'judge' ? (q.a ? '正确' : '错误') : q.a.split('').join('、');
    html += `<div class="explain show">
      ${right ? '✅ <b>回答正确</b>' : '❌ <b>回答错误</b>，正确答案：<b>'+answerTxt+'</b>'}
    </div>`;
  }

  card.innerHTML = html;

  // 绑定事件
  card.querySelectorAll('.opt').forEach(el => el.onclick = () => onPickOpt(el.dataset.k));
  card.querySelectorAll('.jbtn').forEach(el => el.onclick = () => onPickJudge(el.dataset.v));

  // 收藏按钮
  const fb = document.getElementById('btnFav');
  fb.classList.toggle('on', !!rec.fav);
  fb.textContent = rec.fav ? '★ 已收藏' : '☆ 收藏';

  // 显示答案按钮
  const bs = document.getElementById('btnShow');
  if (state.type === 'fill') {
    bs.style.display = '';
    bs.textContent = rec.ans ? '收起答案' : '显示答案';
  } else if (rec.ans) {
    bs.style.display = 'none';
  } else {
    bs.style.display = '';
    bs.textContent = '显示答案';
  }

  renderGrid();
  renderStat();
}

function onPickOpt(k){
  const rec = state.rec[key()] || {};
  if (rec.ans) return;
  if (state.type === 'single') {
    rec.ans = k;
    rec.ok = (k === curQ().a);
    state.rec[key()] = rec; save(); render();
  } else {
    // multi
    rec.tmp = rec.tmp || [];
    const i = rec.tmp.indexOf(k);
    if (i >= 0) rec.tmp.splice(i,1); else rec.tmp.push(k);
    rec.tmp.sort();
    state.rec[key()] = rec; render();
  }
}
function submitMulti(){
  const rec = state.rec[key()] || {};
  if (!rec.tmp || rec.tmp.length === 0) { alert('请先勾选选项'); return; }
  rec.ans = rec.tmp.join('');
  rec.ok = (rec.ans === curQ().a);
  state.rec[key()] = rec; save(); render();
}
function onPickJudge(v){
  const rec = state.rec[key()] || {};
  if (rec.ans) return;
  rec.ans = v;
  rec.ok = (v === (curQ().a ? 'T' : 'F'));
  state.rec[key()] = rec; save(); render();
}

function renderGrid(){
  const list = curList();
  const g = document.getElementById('grid');
  g.innerHTML = '';
  list.forEach((_, i) => {
    const r = state.rec[state.type + '_' + i] || {};
    const c = document.createElement('div');
    c.className = 'cell';
    if (i === state.idx) c.classList.add('cur');
    if (r.fav) c.classList.add('fav');
    if (r.ans) c.classList.add(r.ok ? 'right' : 'wrong');
    c.textContent = i + 1;
    c.onclick = () => { state.idx = i; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    g.appendChild(c);
  });
}

function renderStat(){
  const list = curList();
  let right = 0, wrong = 0, fav = 0, done = 0;
  list.forEach((_, i) => {
    const r = state.rec[state.type + '_' + i] || {};
    if (r.ans) { done++; if (r.ok) right++; else wrong++; }
    if (r.fav) fav++;
  });
  document.getElementById('mRight').textContent = right;
  document.getElementById('mWrong').textContent = wrong;
  document.getElementById('mAcc').textContent = done ? Math.round((right/done)*100) + '%' : '--';
  document.getElementById('sRight').textContent = right;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sAcc').textContent = done ? Math.round((right/done)*100) + '%' : '--';
  document.getElementById('sFav').textContent = fav;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 顶部切换
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    state.type = t.dataset.t;
    state.idx = 0;
    render();
    window.scrollTo({top:0});
  };
});
document.getElementById('btnPrev').onclick = () => { if (state.idx > 0) { state.idx--; render(); } };
document.getElementById('btnNext').onclick = () => {
  const list = curList();
  if (state.type === 'multi') {
    const rec = state.rec[key()] || {};
    if (!rec.ans) { submitMulti(); return; }
  }
  if (state.idx < list.length - 1) { state.idx++; render(); }
};
document.getElementById('btnFav').onclick = () => {
  const rec = state.rec[key()] || {};
  rec.fav = !rec.fav;
  state.rec[key()] = rec; save(); render();
};
document.getElementById('btnShow').onclick = () => {
  const rec = state.rec[key()] || {};
  if (state.type === 'fill') {
    rec.ans = !rec.ans;
    state.rec[key()] = rec; save(); render();
    return;
  }
  // 选择题/判断题：直接显示答案
  rec.ans = rec.ans || (state.type === 'judge' ? (curQ().a?'T':'F') : curQ().a);
  rec.ok = false; // 主动看答案视为未答对
  state.rec[key()] = rec; save(); render();
};
document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(state.rec)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '党校刷题进度-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
};
document.getElementById('btnImport').onclick = () => {
  document.getElementById('fileInput').click();
};
document.getElementById('fileInput').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (typeof obj !== 'object') throw 0;
      if (confirm('导入将覆盖当前所有做题记录，确定？')) {
        state.rec = obj; save(); render();
        alert('导入成功');
      }
    } catch { alert('文件格式不对，没导入'); }
  };
  reader.readAsText(f);
};
document.getElementById('btnReset').onclick = () => {
  if (confirm('确定清空所有做题记录和收藏？此操作不可恢复')) {
    state.rec = {}; save(); render();
  }
};

render();
</script>
</body>
</html>
